# Plug-and-play: `docker compose up --build` → http://localhost:3000
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dairy-ledger:latest
    container_name: dairy-ledger
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
